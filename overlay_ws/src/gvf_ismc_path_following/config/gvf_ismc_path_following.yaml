/gvf_reference_node:
  ros__parameters:
    odom_topic: "/drone_1/aft_mapped_to_init_level"
    reference_topic: "/gvf/reference"
    target_height_m: 1.2
    trajectory_type: "three_leaf"
    radius_m: 3.5
    base_radius_m: 3.5
    lobe_amplitude_m: 0.6
    lateral_gain: 1.0
    vertical_gain: 0.4
    max_speed_mps: 0.55
    min_planar_speed_for_yaw_mps: 0.05
    yaw_alpha: 0.1

/ismc_velocity_tracker_node:
  ros__parameters:
    odom_topic: "/drone_1/aft_mapped_to_init_level"
    reference_topic: "/gvf/reference"
    command_topic: "/drone_1_planning/pos_cmd"
    frame_id: "world"
    use_px4_position_hold_for_z: false
    target_height_m: 1.2
    control_rate_hz: 50.0
    input_timeout_sec: 0.5
    publish_position_nan: true
    lambda: 1.6
    k: 0.8
    gamma: 0.0
    c1: 0.05
    epsilon: 0.01
    adaptation_gain: 0.0
    max_acceleration_mps2: 2.0
    enable_adaptation: false
