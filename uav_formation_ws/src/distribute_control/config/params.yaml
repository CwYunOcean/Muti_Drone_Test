/**:
  ros__parameters:
    # ==========================================
    # 1. 基础环境配置 (System Config)
    # ==========================================
    system:
      uav_id: 1 # 当前无人机 ID
      total_uavs: 3 # 编队总数量
      loop_rate: 10.0 # 控制频率 (Hz)
      viz_rate: 10.0 # 可视化频率 (Hz)
      location_mode: "indoor" # "indoor" 或 "outdoor"
      is_sim: true # true=仿真, false=实机
      target_system: 0 # 0=仿真按 drone_id+1，其它场景显式填写 PX4 MAV_SYS_ID

    control:
      auto_arm: false # 必须显式打开，默认只进入 Offboard，不自动解锁
      odom_timeout: 0.5 # 本机位置数据最大允许间隔 (s)
      neighbor_timeout: 0.5 # 邻机位置数据最大允许间隔 (s)

    world:
      origin_x: 0.0
      origin_y: 0.0
      origin_z: 0.0
      origin_yaw_rad: 0.0

    # ==========================================
    # 2. 任务与轨迹配置 (Mission Config)
    # ==========================================
    mission:
      takeoff_height: 2.0 # 起飞高度 (m)
      formation_spacing: 3.0 # [重要] 编队间距 (m)，用于计算邻居偏移

      # [核心修改] 曲线类型 ID
      # 0: Ellipse (椭圆/圆)
      # 1: Eight (8字形)
      # 2: Squircle (圆角矩形)
      # 3: B-Spline (B样条)
      curve_id: 0

      # 曲线几何参数: [param1, param2, param3]
      # - Ellipse: [长轴a, 短轴b, 0]
      # - Eight:   [宽a, 高b, 0]
      # - Squircle:[宽a, 高b, 圆角n]
      curve_params: [5.0, 2.0, 2.0]

      # 偏航角模式
      # 0: 固定 (始终朝向 x 轴)
      # 1: 切向 (车头朝向飞行方向)
      yaw_mode: 0

    # ==========================================
    # 3. 控制器增益 (Control Gains)
    # ==========================================
    gains:
      k_pos: 0.1 # 位置误差 P 增益
      k_c: 1.0 # 协同一致性增益
      look_ahead: 0.0 # 前瞻距离 (m)
      max_speed: 1.0 # 速度限幅 (m/s)

    # ==========================================
    # 4. 避障算法配置 (Avoidance - ORCA)
    # ==========================================
    orca:
      enabled: true # 开关
      safe_dist: 0.5 # 安全半径 (m)
      time_horizon: 2.0 # 预测时间窗 (s)
      max_speed: 2.0 # 避障最大速度 (m/s)

    # ==========================================
    # 5. 通信与拓扑 (Comm & Topology)
    # ==========================================
    comm:
      range: 10.0 # 感知半径 (大于此距离不视为邻居)
      delay: 0.0 # 模拟通信延迟 (s)
